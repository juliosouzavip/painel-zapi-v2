<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas Confirmadas — VIP Turismo Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EDE6;--surface:#FFFFFF;--ink:#1C1C28;--ink-2:#6B6660;
  --gilt:#B89448;--gilt-h:#9A7A38;--border:#DDD9D0;--tint:#F7F5F1;
  --navy:#1C1C28;--green:#2a8a4a;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151921;--surface:#1C2232;--ink:#E4E0D8;--ink-2:#8A8480;
    --gilt:#C9A96E;--gilt-h:#B89448;--border:#252D42;--tint:#1C2232;--navy:#0D1117;--green:#3aaa5a;
  }
}
:root[data-theme="dark"]{
  --bg:#151921;--surface:#1C2232;--ink:#E4E0D8;--ink-2:#8A8480;
  --gilt:#C9A96E;--gilt-h:#B89448;--border:#252D42;--tint:#1C2232;--navy:#0D1117;--green:#3aaa5a;
}
body{font-family:'Lato',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6}
.page{max-width:540px;margin:0 auto;padding-bottom:60px}

/* HEADER */
.site-hdr{padding:20px 24px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.brand{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gilt)}
.lock{font-size:10px;color:var(--ink-2);letter-spacing:.5px;text-transform:uppercase}

/* SUCCESS HERO */
.success-hero{padding:40px 24px 32px;text-align:center;border-bottom:1px solid var(--border)}
.check-ring{width:72px;height:72px;border-radius:50%;border:2px solid color-mix(in srgb,var(--gilt) 35%,transparent);background:color-mix(in srgb,var(--gilt) 10%,transparent);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.hero-title{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:600;line-height:1.2;text-wrap:balance;margin-bottom:8px}
.hero-sub{font-size:14px;color:var(--ink-2);line-height:1.7;margin-bottom:16px}
.conf-code{display:inline-block;background:var(--tint);border:1px solid var(--border);border-radius:6px;padding:6px 16px;font-size:12px;font-family:monospace;letter-spacing:2px;color:var(--gilt);font-weight:700}
.conf-date{font-size:11px;color:var(--ink-2);margin-top:8px;letter-spacing:.5px}

/* ITINERARY REVIEW */
.review-wrap{padding:28px 24px 0}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink-2);margin-bottom:18px}
.review-header{display:flex;flex-direction:column;gap:2px;margin-bottom:20px;padding:16px 18px;background:var(--tint);border-radius:8px;border:1px solid var(--border)}
.review-cliente{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:600;color:var(--ink)}
.review-titulo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:14px;color:var(--gilt)}

/* SERVICE CARDS (same as roteiro.html) */
.day-row{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.day-row:first-child{margin-top:0}
.day-line{flex:1;height:1px;background:var(--border)}
.day-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.svc{background:var(--surface);border-radius:8px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06),0 0 0 1px var(--border);display:flex}
.svc-strip{width:3px;flex-shrink:0}
.svc-body{padding:13px 16px;flex:1;min-width:0}
.svc-type{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.svc-name{font-size:14px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:7px}
.svc-meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-bottom:6px}
.svc-mi{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.svc-desc{font-size:13px;color:var(--ink);line-height:1.6}
.svc-obs{margin-top:7px;font-size:12px;color:#8B6914;background:rgba(184,148,72,.1);border-radius:4px;padding:6px 10px;border-left:2px solid var(--gilt);line-height:1.5}

/* STEPS */
.steps-wrap{padding:28px 24px 0}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:flex-start;gap:14px}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--gilt);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.step-txt{font-size:14px;color:var(--ink);line-height:1.6}

/* UPSELL */
.upsell-wrap{padding:28px 24px 0}
.upsell-intro{margin-bottom:20px}
.upsell-intro h2{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;margin-bottom:6px;text-wrap:balance}
.upsell-intro p{font-size:13px;color:var(--ink-2);line-height:1.6}
.upsell-list{display:flex;flex-direction:column;gap:12px}

/* UPSELL CARD — layout horizontal, mais detalhado */
.u-card{background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06),0 0 0 1px var(--border)}
.u-top{display:flex;gap:0}
.u-icon-col{width:72px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.u-main{padding:14px 16px 0 8px;flex:1;min-width:0}
.u-name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.3}
.u-desc{font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:6px}
.u-price{font-size:12px;font-weight:700;color:var(--gilt);font-variant-numeric:tabular-nums}
.u-toggle{width:100%;background:none;border:none;border-top:1px solid var(--border);padding:10px 16px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;letter-spacing:.3px;transition:color .15s;margin-top:12px}
.u-toggle:hover{color:var(--gilt)}
.u-toggle .arr{transition:transform .2s;display:inline-block}
.u-details{display:none;padding:12px 16px;border-top:1px solid var(--border);background:var(--tint)}
.u-details.open{display:block}
.u-detail-item{font-size:12px;color:var(--ink-2);line-height:1.7;display:flex;gap:7px}
.u-detail-item::before{content:'✦';color:var(--gilt);flex-shrink:0;font-size:10px;margin-top:3px}
.u-actions{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.u-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:var(--bg);border:none;border-radius:6px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;transition:opacity .2s;letter-spacing:.3px}
.u-btn:hover{opacity:.85}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .u-btn{background:var(--gilt);color:#151921}}
:root[data-theme="dark"] .u-btn{background:var(--gilt);color:#151921}

/* CTA BOTTOM */
.cta-bottom{margin:28px 24px 0;background:var(--navy);color:var(--bg);border-radius:10px;padding:26px 24px;text-align:center}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta-bottom{background:var(--tint);color:var(--ink)}}
:root[data-theme="dark"] .cta-bottom{background:var(--tint);color:var(--ink)}
.cta-bottom h3{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:600;margin-bottom:6px}
.cta-bottom p{font-size:13px;opacity:.75;margin-bottom:18px;line-height:1.6}
.btn-wp{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;border:none;border-radius:6px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .2s;letter-spacing:.3px}
.btn-wp:hover{background:#1ebe5d}

/* FOOTER */
footer{border-top:1px solid var(--border);margin-top:40px;padding:24px;text-align:center;font-size:11px;color:var(--ink-2);letter-spacing:.5px;text-transform:uppercase;line-height:1.9}
footer strong{color:var(--gilt);font-size:12px}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:mfade .2s ease}
@media(min-width:480px){.modal-ov{align-items:center;padding:20px}}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:mslide .25s cubic-bezier(.34,1.2,.64,1)}
@media(min-width:480px){.modal{border-radius:14px;animation:mpop .25s cubic-bezier(.34,1.2,.64,1)}}
@keyframes mslide{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes mpop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:20px 20px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-icon-name{display:flex;align-items:center;gap:12px}
.modal-icon{font-size:30px;flex-shrink:0}
.modal-name{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:600;color:var(--ink);line-height:1.3}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-2);padding:0;line-height:1;flex-shrink:0;margin-top:-2px}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:18px 20px}
.modal-desc{font-size:14px;color:var(--ink-2);line-height:1.65;margin-bottom:14px}
.modal-price{display:inline-block;font-size:13px;font-weight:700;color:var(--gilt);background:color-mix(in srgb,var(--gilt) 10%,transparent);border-radius:4px;padding:4px 12px;margin-bottom:18px}
.modal-inc-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.modal-items{display:flex;flex-direction:column;gap:9px}
.modal-item{font-size:13px;color:var(--ink);line-height:1.6;display:flex;gap:9px}
.modal-item::before{content:'✦';color:var(--gilt);flex-shrink:0;font-size:10px;margin-top:4px}
.modal-foot{padding:0 20px 24px}
.modal-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25D366;color:#fff;border:none;border-radius:8px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .2s;letter-spacing:.3px}
.modal-cta:hover{background:#1ebe5d}

@media(prefers-reduced-motion:reduce){.check-ring{animation:none}}
</style>
</head>
<body>
<div class="page">
  <header class="site-hdr"><span class="brand">VIP Turismo Paris</span><span class="lock">🔒 Seguro</span></header>
  <div id="main"><div style="display:flex;align-items:center;justify-content:center;min-height:60vh"><div style="width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--gilt);border-radius:50%;animation:pop .7s linear infinite"></div></div></div>
</div>
<script>
const WP='33XXXXXXXXX'; // substitua pelo número WhatsApp da empresa
const CO='VIP Turismo Paris';

const T={
  voo:         {l:'Voo',         e:'✈️', c:'#5470C6'},
  transfer:    {l:'Transfer',    e:'🚗', c:'#4E9F7B'},
  hotel:       {l:'Hotel',       e:'🏨', c:'#8B5CF6'},
  tour:        {l:'Passeio',     e:'🗼', c:'#D97706'},
  restaurante: {l:'Restaurante', e:'🍽️', c:'#DC4444'},
  ingresso:    {l:'Ingresso',    e:'🎟️', c:'#0891B2'},
  cruzeiro:    {l:'Cruzeiro',    e:'🛥️', c:'#2563EB'},
  outro:       {l:'Serviço',     e:'📋', c:'#6B7280'},
};

const UPSELLS=[
  {
    e:'🛥️',c:'#006064',n:'Cruzeiro no Rio Sena',
    d:'Passeio ao entardecer pelos monumentos de Paris',
    detalhes:['Duração: 1h30','Saídas às 17h30 e 20h00','Champagne e petiscos a bordo incluídos','Lugar reservado à boreste (melhor vista)','Narração dos pontos turísticos em português'],
    p:'A partir de €45/pp'
  },
  {
    e:'🗼',c:'#e65100',n:'Torre Eiffel — Acesso VIP',
    d:'Entrada prioritária e subida ao topo com guia particular em português',
    detalhes:['Sem fila: acesso direto pelo elevador prioritário','Inclui subida ao 3° andar (276m de altura)','Guia particular em português por 1h30','Taça de champagne no topo inclusa','Máximo 8 pessoas por grupo'],
    p:'A partir de €85/pp'
  },
  {
    e:'🏰',c:'#4a148c',n:'Versalhes — Dia Completo',
    d:'Palácio e jardins com transporte privativo e guia incluso',
    detalhes:['Transporte privativo ida e volta do hotel','Acesso prioritário ao Palácio (sem fila)','Guia em português por 3h','Jardins de Le Nôtre com as grandes fontes','Inclui almoço em restaurante típico local','Duração: dia inteiro (~8h)'],
    p:'A partir de €120/pp'
  },
  {
    e:'🎨',c:'#1a237e',n:'Louvre — Visita Guiada VIP',
    d:'Tour guiado com acesso preferencial às obras principais',
    detalhes:['Entrada sem fila pelo acesso profissional','Guia em português por 2h30','Roteiro focado: Mona Lisa, Vênus de Milo, Vitória de Samotrácia','Máximo 6 pessoas — experiência íntima','Fone de ouvido individual incluso'],
    p:'A partir de €75/pp'
  },
  {
    e:'🍷',c:'#880e4f',n:'Tour Gastronômico',
    d:'Degustação de vinhos e iguarias típicas parisienses',
    detalhes:['Visita a 3 produtores e adegas selecionados','Degustação de 8 vinhos com comentários do sommelier','Tábua de queijos e frios artesanais incluída','Macarons e doces parisienses na finalização','Duração: 3h — grupos de até 10 pessoas'],
    p:'A partir de €95/pp'
  },
  {
    e:'🌹',c:'#b71c1c',n:'Jantar Romântico — Vista Torre Eiffel',
    d:'Jantar gourmet em restaurante com vista privilegiada para a Torre iluminada',
    detalhes:['Mesa reservada à janela com vista direta para a Torre Eiffel','Menu 4 tempos com harmonização de vinhos','Champagne de boas-vindas incluso','Serviço personalizado e atendimento em português','Reserva garantida — sem risco de indisponibilidade'],
    p:'A partir de €180/pp'
  },
  {
    e:'🎭',c:'#c62828',n:'Moulin Rouge — Espetáculo',
    d:'O cabaret mais famoso do mundo com lugares na primeira fila',
    detalhes:['Lugar reservado na primeira fila (melhor visão do palco)','Champagne demi-bouteille por pessoa incluso','Espetáculo Féerie: 60 artistas, 1.000 fantasias','Duração do espetáculo: 1h55','Sessões às 21h e 23h — escolha no momento da reserva'],
    p:'A partir de €120/pp'
  },
  {
    e:'🚖',c:'#1b5e20',n:'Transfer Executivo — Upgrade',
    d:'Van de luxo com motorista exclusivo disponível 24h',
    detalhes:['Mercedes Viano ou similar — até 6 passageiros','Motorista bilíngue (francês/inglês)','Água mineral, Wi-Fi e carregadores a bordo','Disponível 24h — aeroporto, hotel e passeios','Pontualidade garantida: monitoramento de voo em tempo real'],
    p:'A partir de €95/trecho'
  },
];

function dec(h){try{return JSON.parse(decodeURIComponent(escape(atob(h))));}catch(e){return null;}}
function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function wp(msg){return `https://wa.me/${WP}?text=${encodeURIComponent(msg)}`;}
function fmtDate(s){
  if(!s)return '';
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    try{const d=new Date(s+'T12:00:00');return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).replace(/\b\w/g,c=>c.toUpperCase());}catch(e){}
  }
  return s;
}
function byDate(svcs){const g={};svcs.forEach(s=>{const k=s.data||'';(g[k]=g[k]||[]).push(s);});return g;}

function svcCard(s){
  const t=T[s.tipo]||T.outro;
  return `<div class="svc">
    <div class="svc-strip" style="background:${t.c}"></div>
    <div class="svc-body">
      <div class="svc-type">${t.l}</div>
      <div class="svc-name">${esc(s.nome)}</div>
      ${(s.hora||s.local||s.valor)?`<div class="svc-meta">
        ${s.hora?`<span class="svc-mi">🕐 ${esc(s.hora)}</span>`:''}
        ${s.local?`<span class="svc-mi">📍 ${esc(s.local)}</span>`:''}
        ${s.valor?`<span class="svc-mi">💰 ${esc(s.valor)}</span>`:''}
      </div>`:''}
      ${s.desc?`<div class="svc-desc">${esc(s.desc)}</div>`:''}
      ${s.obs?`<div class="svc-obs">ℹ️ ${esc(s.obs)}</div>`:''}
    </div>
  </div>`;
}

let G_CTX={};

function upsellCard(u,idx){
  return `<div class="u-card" onclick="openModal(${idx})" style="cursor:pointer">
    <div class="u-top">
      <div class="u-icon-col" style="background:${u.c}18">${u.e}</div>
      <div class="u-main" style="padding-bottom:14px">
        <div class="u-name">${esc(u.n)}</div>
        <div class="u-desc">${esc(u.d)}</div>
        <div class="u-price">${esc(u.p)}</div>
      </div>
      <div style="display:flex;align-items:center;padding:0 14px 0 0;flex-shrink:0;color:var(--ink-2);font-size:18px">›</div>
    </div>
  </div>`;
}

function openModal(idx){
  const u=UPSELLS[idx];
  const {ref,titulo,nomeCliente}=G_CTX;
  const wpMsg=`Olá! Me chamo ${nomeCliente||'cliente'}, tenho um roteiro confirmado com a VIP Turismo Paris` +
    `${ref?` (ref. ${ref})`:''}${titulo?` — "${titulo}"`:''}.\n\n` +
    `Tenho interesse em adicionar ao meu roteiro:\n` +
    `*${u.n}*\n${u.d}\n\n` +
    `O que está incluído:\n${u.detalhes.map(d=>`• ${d}`).join('\n')}\n\n` +
    `Preço estimado: ${u.p}\n\n` +
    `Poderia verificar disponibilidade e me enviar mais detalhes?`;

  const ov=document.createElement('div');
  ov.className='modal-ov';ov.id='modal-ov';
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="modal-icon-name">
        <span class="modal-icon">${u.e}</span>
        <span class="modal-name">${esc(u.n)}</span>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Fechar">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-desc">${esc(u.d)}</div>
      <div class="modal-price">${esc(u.p)}</div>
      <div class="modal-inc-lbl">O que está incluído</div>
      <div class="modal-items">${u.detalhes.map(d=>`<div class="modal-item">${esc(d)}</div>`).join('')}</div>
    </div>
    <div class="modal-foot">
      <a class="modal-cta" href="${wp(wpMsg)}" target="_blank">💬 Solicitar este serviço</a>
    </div>
  </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
}

function closeModal(){
  const m=document.getElementById('modal-ov');
  if(m)m.remove();
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function init(){
  const hash=location.hash.slice(1);
  const d=hash?dec(hash):{};
  const nome=(d.cliente?.nome||'').split(' ')[0]||'Cliente';
  const nomeCompleto=d.cliente?.nome||'';
  const titulo=d.titulo||'seu roteiro';
  const ref=(d.id||'').slice(-6).toUpperCase()||'—';
  const now=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  // itinerary summary
  const groups=byDate(d.svcs||[]);
  let svcsHtml=Object.entries(groups).map(([dt,svcs])=>`
    <div class="day-row"><div class="day-line"></div><span class="day-lbl">${fmtDate(dt)||'Sem data definida'}</span><div class="day-line"></div></div>
    ${svcs.map(svcCard).join('')}`).join('');
  if(!svcsHtml)svcsHtml='<p style="color:var(--ink-2);font-size:13px">Nenhum serviço listado.</p>';

  const wpConf=wp(`Olá! Me chamo ${nomeCompleto||'cliente'}, confirmo meu roteiro "${titulo}" (ref. ${ref}). Pode prosseguir com todas as reservas. ✅`);
  const wpDvd=wp(`Olá! Tenho dúvidas sobre meu roteiro confirmado "${titulo}" (ref. ${ref}).`);
